apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app: {{ .Release.Name }}
data:
  api-port: {{ .Values.service.targetPort | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: {{ .Release.Name }}
data:
  admin-pass-must-remove: {{ .Values.env.ADMIN_PASS_MUST_REMOVE | b64enc }}
